name: Build and Push Paseo Custom Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
  # 支持在 GitHub 仓库 Actions 页面手动点击按钮触发
  workflow_dispatch:
  # 支持每周一定时构建，确保自动跟进 npm 依赖包与基础镜像更新
  schedule:
    - cron: '0 3 * * 1'

env:
  REGISTRY: ghcr.io
  # 镜像名称转为小写：ghcr.io/<你的用户名>/paseo-custom
  IMAGE_NAME: ${{ github.repository_owner }}/paseo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 准备 Docker Buildx 多架构/高效构建引擎
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry (GHCR)
      # 使用 GitHub 自带的 GITHUB_TOKEN，无需手动创建任何密钥
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取标签与版本元数据 (生成 latest 和 commit sha 标签)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 构建并推送到 GHCR，启用 GitHub Actions 缓存加速
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
